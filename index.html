<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Футбольное Табло v.FINAL_V18 (Увеличенное Название)</title>
    <style>
        /* === БАЗОВЫЕ СТИЛИ И ФОН === */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: black; 
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .scoreboard-container {
            width: 95%; 
            max-width: 1600px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.75); 
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 0 70px rgba(0, 255, 0, 0.5);
        }

        /* === СТИЛИ НАЗВАНИЙ КОМАНД (УМЕНЬШЕННЫЕ ДЛЯ ВМЕСТИМОСТИ) === */
        .score-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .team {
            flex-grow: 1;
            padding: 0 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .team-name-input {
            /* КРИТИЧЕСКОЕ ИЗМЕНЕНИЕ: Уменьшаем размер шрифта для вместимости */
            font-size: 4em; 
            color: red; 
            background: none;
            border: none;
            outline: none;
            text-align: center;
            width: 100%; 
            min-width: 200px;
            cursor: text;
            text-transform: uppercase;
            font-weight: bold;
            padding: 10px 0;
            white-space: normal; 
            height: auto;
            font-family: Arial, sans-serif;
        }

        /* === СТИЛИ СЧЕТА И ПЕРИОДА === */
        .score {
            font-size: 15em;
            color: lime;
            background-color: black;
            padding: 10px 40px;
            border-radius: 15px;
            margin-top: 10px;
            min-width: 200px;
            font-family: monospace;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .timer-period-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .period-label {
            font-size: 2em; 
            color: white;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .period-display {
            font-size: 4em; 
            color: white;
            background-color: black;
            padding: 5px 30px;
            border-radius: 5px;
            min-width: 80px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
            font-family: monospace;
        }

        .timer-display {
            font-size: 8em;
            color: lime;
            background-color: black;
            padding: 10px 40px;
            border-radius: 15px;
            margin-top: 10px;
            font-family: monospace;
            box-shadow: inset 0 0 30px rgba(0, 255, 0, 0.8);
        }

        /* Индикатор паузы */
        .paused-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: yellow;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 0 5px black;
            opacity: 1; 
            transition: opacity 0.5s;
        }

        .paused-indicator.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <div id="paused-indicator" class="paused-indicator">ПАУЗА</div>

        <div class="score-display">
            <div class="team team-home">
                <input type="text" id="home-name" class="team-name-input" value="ДОМАШНЯЯ КОМАНДА">
                <div id="home-score" class="score">0</div>
            </div>

            <div class="team team-guest">
                <input type="text" id="guest-name" class="team-name-input" value="ГОСТЕВАЯ КОМАНДА">
                <div id="guest-score" class="score">0</div>
            </div>
        </div>

        <div class="timer-period-container">
            <div class="period-label">PERIOD</div>
            <div id="period" class="period-display">1</div>
            

            <div id="timer" class="timer-display">00.00</div>
        </div>
    </div>

    <script>
        // === ПЕРЕМЕННЫЕ И ЭЛЕМЕНТЫ DOM ===
        const homeScoreEl = document.getElementById('home-score');
        const guestScoreEl = document.getElementById('guest-score');
        const timerEl = document.getElementById('timer');
        const periodEl = document.getElementById('period');
        const homeNameEl = document.getElementById('home-name');
        const guestNameEl = document.getElementById('guest-name');
        const pausedIndicator = document.getElementById('paused-indicator');
        const body = document.body;
        
        let homeScore = 0;
        let guestScore = 0;
        let period = 1;
        let startTime = 0; 
        let elapsedTime = 0; 
        let timerInterval = null; 
        let isPaused = true;
        
        const TIMER_FREQUENCY = 10; 

        // === ФУНКЦИИ УПРАВЛЕНИЯ ТАБЛО ===

        function updateScoreDisplay() {
            homeScoreEl.textContent = homeScore;
            guestScoreEl.textContent = guestScore;
        }

        function updateTimerDisplay(currentMs) {
            const totalSeconds = Math.floor(currentMs / 1000);

            if (totalSeconds < 60) {
                const seconds = String(totalSeconds).padStart(2, '0');
                const milliseconds = String(Math.floor((currentMs % 1000) / 10)).padStart(2, '0');
                timerEl.textContent = `${seconds}.${milliseconds}`;
            } else {
                const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                const seconds = String(totalSeconds % 60).padStart(2, '0');
                timerEl.textContent = `${minutes}:${seconds}`;
            }
        }
        
        function timerLoop() {
            if (!isPaused) {
                const now = Date.now();
                elapsedTime += now - startTime;
                startTime = now;
                updateTimerDisplay(elapsedTime);
            }
        }

        function toggleTimer() {
             // Игнорируем Пробел, если мы вводим текст
            if (document.activeElement.tagName === 'INPUT') return; 

            if (isPaused) {
                isPaused = false;
                pausedIndicator.classList.add('hidden');
                startTime = Date.now(); 
                timerInterval = setInterval(timerLoop, TIMER_FREQUENCY); 
            } else {
                isPaused = true;
                pausedIndicator.classList.remove('hidden');
                clearInterval(timerInterval);
                
                const totalSeconds = Math.floor(elapsedTime / 1000);
                if (totalSeconds >= 60) {
                    elapsedTime = totalSeconds * 1000;
                }
                updateTimerDisplay(elapsedTime);
            }
        }

        function restartGame() {
            clearInterval(timerInterval);
            isPaused = true;
            pausedIndicator.classList.remove('hidden');
            homeScore = 0;
            guestScore = 0;
            period = 1;
            elapsedTime = 0; 
            updateScoreDisplay();
            timerEl.textContent = "00.00"; 
            periodEl.textContent = period;
        }

        /** * Функция для установки фона с обходом кэша. */
        function setBackground() {
            const bgUrl = 'bg.jpg';
            // Добавляем случайный параметр, чтобы браузер не брал из кэша
            const randomQuery = '?v=' + new Date().getTime(); 
            body.style.backgroundImage = `url('${bgUrl}${randomQuery}')`;
        }

        // === ОБРАБОТЧИК КЛАВИАТУРЫ (v.18) ===

        document.addEventListener('keydown', (event) => {
            const code = event.code;
            
            const isInputActive = document.activeElement.tagName === 'INPUT';
            
            // Если активно поле ввода, разрешаем ВСЁ (включая Пробел), и выходим.
            if (isInputActive) {
                return; 
            }


            // 1. Обработка ПРОБЕЛА (Пауза/Старт) - работает только вне поля ввода
            if (code === 'Space') {
                event.preventDefault(); 
                toggleTimer();
                return; 
            }
            
            // 2. Обработка ВСЕХ ОСТАЛЬНЫХ КОМАНДНЫХ КЛАВИШ
            switch (code) {
                // HOME Score (W/S - Ц, Ы)
                case 'KeyW':
                    event.preventDefault();
                    homeScore++;
                    break;
                case 'KeyS':
                    event.preventDefault();
                    if (homeScore > 0) homeScore--;
                    break;
                
                // GUEST Score (Стрелки Вверх/Вниз)
                case 'ArrowUp': 
                    event.preventDefault();
                    guestScore++;
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    if (guestScore > 0) guestScore--;
                    break;

                // Смена Периода (Стрелки Влево/Вправо)
                case 'ArrowLeft':
                    event.preventDefault();
                    if (period > 1) period--;
                    periodEl.textContent = period;
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    period++;
                    periodEl.textContent = period;
                    break;

                // Рестарт (R - К)
                case 'KeyR':
                    event.preventDefault();
                    restartGame();
                    break;
                
                // Смена сторон (Q - Й)
                case 'KeyQ':
                    event.preventDefault();
                    // Меняем местами счет
                    [homeScore, guestScore] = [guestScore, homeScore];
                    // Меняем местами названия команд
                    [homeNameEl.value, guestNameEl.value] = [guestNameEl.value, homeNameEl.value];
                    break;
                
                default:
                    return;
            }

            updateScoreDisplay();
        });


        // === ИНИЦИАЛИЗАЦИЯ ===
        window.onload = () => {
            setBackground(); 
            restartGame();
        };

    </script>
</body>
</html>
